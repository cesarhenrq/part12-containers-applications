services:
  app:
    image: todo-frontend
    build:
      context: .
      dockerfile: ./todo-frontend/Dockerfile

  backend:
    image: todo-backend
    build:
      context: .
      dockerfile: ./todo-backend/Dockerfile
    depends_on:
      - mongo
      - redis

  redis:
    image: redis
    ports:
      - 6379:6379
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis_data:/data

  mongo:
    image: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./mongo_data:/data/db

  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app
      - backend

volumes:
  mongo_data:
  redis_data:
